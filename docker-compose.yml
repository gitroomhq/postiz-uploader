# Local loop: the worker behind a RunPod /run + /status stand-in on :8000 and a bucket stand-in on :8080.
#
#   docker compose up --build
#   python scripts/make_fixtures.py fixtures/generated
#   python scripts/run-local.py fixtures/generated/4k-hevc.mov --endpoint http://localhost:8000
#
# A local Postiz on R2 only needs the worker. A local Temporal for Postiz usually holds port
# 8000 already (and the Temporal UI 8080), so move the worker, and keep one project per worktree:
#
#   UPLOADER_PORT=18000 docker compose -p uploader-<worktree> up --build --no-deps uploader
#   (Postiz: RUNPOD_API_URL=http://localhost:18000/v2, any RUNPOD_API_KEY and RUNPOD_ENDPOINT_ID)
#
services:
  bucket:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./postiz_uploader:/app/postiz_uploader:ro
      - ./fixtures:/data
    command: ["python", "-m", "postiz_uploader.devserver", "/data", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${BUCKET_PORT:-8080}:8080"

  uploader:
    build:
      context: .
      target: cpu
    environment:
      ALLOWED_SOURCE_HOSTS: bucket,host.docker.internal,*.r2.cloudflarestorage.com
      WORKER_CONCURRENCY: "1"
      LOG_LEVEL: info
    command: ["python", "-m", "postiz_uploader.devapi", "--port", "8000"]
    ports:
      - "${UPLOADER_PORT:-8000}:8000"
    # lets run-local.py --bucket-host host.docker.internal serve files from the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - bucket
